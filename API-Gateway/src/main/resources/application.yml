server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: service-a
          uri: lb://A
          predicates:
            - Path=/a/**
        - id: service-b
          uri: lb://B
          predicates:
            - Path=/b/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
